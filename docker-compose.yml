version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inspeksikos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inspeksikos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inspeksikos-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/inspeksikos
      JWT_SECRET: your_super_secret_key_here
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GEMINI_API_KEY: your_gemini_api_key_here
      SUPABASE_URL: https://your-project.supabase.co
      SUPABASE_ANON_KEY: your_supabase_anon_key_here
      SUPABASE_BUCKET: inspeksikos-photos
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inspeksikos-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: InspeksiKos
    depends_on:
      - backend

volumes:
  pgdata:
