name: Backend CI/CD

on:
  push:
    branches:
      - testing
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and rebuild backend
        run: |
          cd /var/www/InspeksiKos-dev
          git pull origin testing
          cd backend
          npm install --prefer-offline --no-audit --no-fund
          rm -rf dist
          npm run build
          pm2 restart inspeksikos-backend
