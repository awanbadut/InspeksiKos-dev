name: Deploy Backend to VPS

on:
  push:
    branches:
      - testing

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and rebuild backend
        run: |
          cd /var/www/InspeksiKos-dev/backend
          git pull origin testing
          npm install
          npm run build
          pm2 restart inspeksikos-backend
