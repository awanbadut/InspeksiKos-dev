name: Frontend CI/CD

on:
  push:
    branches: [main, testing]
    paths: ['frontend/**']
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        run: |
          cd frontend
          npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes \
            --build-env NEXT_PUBLIC_API_URL="/api" \
            --build-env BACKEND_API_URL="http://103.143.71.185:3001" \
            --build-env NEXT_PUBLIC_APP_NAME="InspeksiKos"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
